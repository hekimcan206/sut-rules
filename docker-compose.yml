# `docker compose up --build` starts the rule engine API with zero manual steps.
#   api  -> loads ./rules (mounted read-only over the rules baked into the image) and polls it every 2 s:
#           edit a .rule file and the next request uses it; a broken edit is rejected and the last good bundle keeps
#           serving (GET /api/v1/ruleset shows why).
# Try it:  curl -s -X POST localhost:18422/api/v1/check -H 'content-type: application/json' --data-binary @docs/samples/invoices.json
name: sut-rules

services:
  api:
    image: sut-rules:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      OpenApi__Enabled: "true"
      Rules__Directory: /app/rules
      Rules__PollInterval: "00:00:02"
      OTEL_SERVICE_NAME: sut-rules
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:${API_PORT:-18422}:8080"
    volumes:
      - ./rules:/app/rules:ro
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
